version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: skillforge-mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillforge-server
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/skillforge
      - JWT_ACCESS_SECRET=skillforge_docker_prod_access_secret
      - JWT_REFRESH_SECRET=skillforge_docker_prod_refresh_secret
      - CLIENT_URL=http://localhost:80
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skillforge-client
    restart: always
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongo_data:
